celestial_localizer:
  ros__parameters:
    input_topic: "/celestial_observations"
    pose_topic: "/celestial_pose"
    fix_topic: "/celestial_fix"

    use_stars: true
    use_sun: true
    use_moon: true

    fixed_altitude: 0.0

    initial_latitude: 51.5
    initial_longitude: -0.1

    global_search: false
    stateful_tracking: true

    robust_loss: "soft_l1"
    solver_max_nfev: 30
    solver_max_starts: 25
    publish_tf: true

    map_frame: "map"
    base_frame: "base_link"
