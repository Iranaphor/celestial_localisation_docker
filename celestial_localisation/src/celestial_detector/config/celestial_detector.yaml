celestial_detector:
  ros__parameters:
    input_topic: "/sky_map"
    output_topic: "/celestial_observations"

    detect_stars: true
    detect_sun: true
    detect_moon: true

    reject_aircraft: true
    reject_satellites: true

    star_detection_threshold: 5.0
    star_min_elevation_degrees: 25.0
    star_max_candidates: 64
    minimum_confidence: 0.5
    gmm_boundaries_filename: "gmm_boundaries.json"
    star_benefit_metrics_filename: "simulated_location_filter_samples*.csv"
    star_benefit_min_score: -0.1
    star_benefit_min_present_count: 3
    star_benefit_min_absent_count: 2
    star_benefit_use_high_error_group: true
    star_benefit_use_medium_error_group: false
