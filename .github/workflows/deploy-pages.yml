name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R docs/. _site/
          rm -f _site/random_localisation_metrics.csv
          mkdir -p _site/celestial_localisation/debug_output
          cp celestial_localisation/debug_output/random_localisation_metrics.csv \
            _site/celestial_localisation/debug_output/random_localisation_metrics.csv
          cp celestial_localisation/debug_output/gmm_boundaries.json \
            _site/celestial_localisation/debug_output/gmm_boundaries.json
          test -f _site/index.html
          test -f _site/celestial_localisation/debug_output/random_localisation_metrics.csv
          test -f _site/celestial_localisation/debug_output/gmm_boundaries.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
