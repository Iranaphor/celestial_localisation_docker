services:

#########################################################

  # On the host, allow local Docker clients to access the X server before starting:
  # xhost +local:
  rviz_service:
    build:
      context: ./rviz
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    #container_name: rviz_container_grouped
    pull_policy: build
    network_mode: host
    ipc: "host"

    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-10}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./rviz/all.rviz:/home/ros/all.rviz:ro

    command: ["bash", "-lc", "source /opt/ros/humble/setup.bash && exec rviz2 -d /home/ros/all.rviz"]

#########################################################

  realsense_service:
    extends:
      file: ./realsense_docker/compose.yml
      service: realsense_service
    build:
      context: ./realsense_docker
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    #container_name: realsense_container_grouped
    pull_policy: build

    # Host networking lets ROS 2 DDS discovery work across the host and containers.
    network_mode: host
    ipc: "host"

    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-10}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      REALSENSE_SERIAL_NUMBER: ${REALSENSE_SERIAL_NUMBER:-}
      REALSENSE_CAMERA_NAME: ${REALSENSE_CAMERA_NAME:-camera}
      REALSENSE_CAMERA_NAMESPACE: ${REALSENSE_CAMERA_NAMESPACE:-camera}
      REALSENSE_BASE_FRAME_ID: ${REALSENSE_BASE_FRAME_ID:-link}
      REALSENSE_TF_PARENT_FRAME: ${SENSORS_BASE_LINK_FRAME:-sensors_base_link}
      REALSENSE_TF_CHILD_FRAME: ${REALSENSE_TF_CHILD_FRAME:-camera_link}
      REALSENSE_TF_X: "0.11"
      REALSENSE_TF_Y: "-0.235"
      REALSENSE_TF_Z: "0.08"
      REALSENSE_TF_ROLL: "0.0"
      REALSENSE_TF_PITCH: "0.0"
      REALSENSE_TF_YAW: "-1.57079632679"

#########################################################

  celestial_localisation_service:
    extends:
      file: ./celestial_localisation/compose.yml
      service: celestial_localisation_service
    build:
      context: ./celestial_localisation
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    #container_name: celestial_localisation_container_grouped
    pull_policy: build
    network_mode: host
    ipc: host
    depends_on:
      - realsense_service

    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-10}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      CELESTIAL_CAMERA_TOPIC: ${CELESTIAL_CAMERA_TOPIC:-/camera/camera/color/image_raw}
      CELESTIAL_SKY_MAP_TOPIC: ${CELESTIAL_SKY_MAP_TOPIC:-/sky_map}
      CELESTIAL_OBSERVATIONS_TOPIC: ${CELESTIAL_OBSERVATIONS_TOPIC:-/celestial_observations}
      CELESTIAL_POSE_TOPIC: ${CELESTIAL_POSE_TOPIC:-/celestial_pose}
      CELESTIAL_FIX_TOPIC: ${CELESTIAL_FIX_TOPIC:-/celestial_fix}
      CELESTIAL_PANORAMA_WIDTH: ${CELESTIAL_PANORAMA_WIDTH:-2048}
      CELESTIAL_PANORAMA_HEIGHT: ${CELESTIAL_PANORAMA_HEIGHT:-1024}
      CELESTIAL_CALIBRATION_FILE: ${CELESTIAL_CALIBRATION_FILE:-}
      CELESTIAL_DETECT_STARS: ${CELESTIAL_DETECT_STARS:-true}
      CELESTIAL_DETECT_SUN: ${CELESTIAL_DETECT_SUN:-true}
      CELESTIAL_DETECT_MOON: ${CELESTIAL_DETECT_MOON:-true}
      CELESTIAL_STAR_THRESHOLD: ${CELESTIAL_STAR_THRESHOLD:-5.0}
      CELESTIAL_MIN_CONFIDENCE: ${CELESTIAL_MIN_CONFIDENCE:-0.5}
      CELESTIAL_USE_SUN: ${CELESTIAL_USE_SUN:-true}
      CELESTIAL_USE_MOON: ${CELESTIAL_USE_MOON:-true}
      CELESTIAL_USE_STARS: ${CELESTIAL_USE_STARS:-true}
      CELESTIAL_FIXED_ALTITUDE: ${CELESTIAL_FIXED_ALTITUDE:-0.0}
      CELESTIAL_INITIAL_LATITUDE: ${CELESTIAL_INITIAL_LATITUDE:-51.5}
      CELESTIAL_INITIAL_LONGITUDE: ${CELESTIAL_INITIAL_LONGITUDE:--0.1}
      CELESTIAL_PUBLISH_TF: ${CELESTIAL_PUBLISH_TF:-true}
      CELESTIAL_MAP_FRAME: ${CELESTIAL_MAP_FRAME:-map}
      CELESTIAL_BASE_FRAME: ${CELESTIAL_BASE_FRAME:-base_link}

    volumes:
      - ./celestial_localisation/src:/home/ros/ros2_ws/src:rw
      - ./celestial_localisation/start.sh:/home/ros/start.sh:ro

#########################################################
